services:
  - type: web
    name: codelearn-platform
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
    staticPublishPath: dist/public
